<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#8b5cf6;#06b6d4;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#3b82f6;#ec4899;#10b981;#8b5cf6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#6366f1;#3b82f6;#ec4899;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; fill: #cbd5e1; }
    
    @keyframes pulse {
      0% { r: 6px; opacity: 1; }
      50% { r: 10px; opacity: 0.4; }
      100% { r: 6px; opacity: 1; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .pulsing-dot { animation: pulse 2s infinite ease-in-out; }
    .tracking-line { stroke-dasharray: 8, 6; animation: dash 2s linear infinite; }
    .floating { animation: floatIcon 4s ease-in-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.15" stroke="#475569" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Glowing background blobs -->
  <circle cx="150" cy="120" r="130" fill="#6366f1" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="150;180;150" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="280" r="140" fill="#ec4899" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cy" values="280;250;280" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Header Category Pill -->
  <g transform="translate(60, 50)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.5" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" class="tag">CURATED ECOSYSTEM GUIDE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="130" class="title">Awesome Post-Purchase Experience</text>
  <text x="60" y="165" fill="url(#accentGrad)" font-family="sans-serif" font-weight="900" font-size="28px" filter="url(#subtleGlow)">Tracking • Returns • Visibility • Protection • Logistics APIs</text>
  <text x="60" y="205" class="subtitle">The definitive open directory of leading SaaS platforms and open-source post-purchase tools.</text>

  <!-- Dynamic Post-Purchase Pipeline Infographic -->
  <g transform="translate(60, 260)">
    <!-- Pipeline Box Background -->
    <rect width="1080" height="95" rx="12" fill="#0d1527" stroke="#1e293b" stroke-width="1.5" />

    <!-- Connecting Track Line -->
    <line x1="100" y1="48" x2="980" y2="48" stroke="#334155" stroke-width="4" />
    <line x1="100" y1="48" x2="980" y2="48" stroke="url(#accentGrad)" stroke-width="3" class="tracking-line" />

    <!-- Step 1: Order Placed -->
    <g transform="translate(100, 48)">
      <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#6366f1" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#6366f1" class="pulsing-dot" />
      <text x="0" y="32" text-anchor="middle" class="node-text">📦 Order Placed</text>
    </g>

    <!-- Step 2: In-Transit Tracking -->
    <g transform="translate(320, 48)">
      <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#3b82f6" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#3b82f6" class="pulsing-dot" />
      <text x="0" y="32" text-anchor="middle" class="node-text">🚚 Live Tracking</text>
    </g>

    <!-- Step 3: Notifications & Protection -->
    <g transform="translate(540, 48)">
      <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#8b5cf6" class="pulsing-dot" />
      <text x="0" y="32" text-anchor="middle" class="node-text">🛡️ Package Shield</text>
    </g>

    <!-- Step 4: Delivery -->
    <g transform="translate(760, 48)">
      <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#10b981" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#10b981" class="pulsing-dot" />
      <text x="0" y="32" text-anchor="middle" class="node-text">📬 Delivered</text>
    </g>

    <!-- Step 5: Returns / Exchanges / RMA -->
    <g transform="translate(980, 48)">
      <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#ec4899" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#ec4899" class="pulsing-dot" />
      <text x="0" y="32" text-anchor="middle" class="node-text">🔄 Returns &amp; RMA</text>
    </g>
  </g>
</svg>